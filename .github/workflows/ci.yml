name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Solo dependencias de producción: hoy hay un aviso 'high' (braces) únicamente en la cadena de dev de eslint-config-next.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

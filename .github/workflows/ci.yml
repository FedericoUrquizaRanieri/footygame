name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    # Postgres efímero solo para los tests de integración y seguridad. Las contraseñas son
    # descartables (el contenedor desaparece al terminar el job) y no dan acceso a nada real.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_superuser_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://footygame_app:ci_app_pw@localhost:5432/footygame_test
      TEST_DATABASE_URL_ADMIN: postgresql://footygame_admin:ci_admin_pw@localhost:5432/footygame_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crear roles y bases de test
        run: >-
          psql "postgresql://postgres:ci_superuser_pw@localhost:5432/postgres"
          -v ON_ERROR_STOP=1 -v admin_pw=ci_admin_pw -v app_pw=ci_app_pw
          -f scripts/db/setup.sql
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # Solo dependencias de producción: hoy hay un aviso 'high' (braces) únicamente en la cadena de dev de eslint-config-next.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
